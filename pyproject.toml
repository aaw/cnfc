[project]
name = "cnfc"
dynamic = ["version"]
description = "A DIMACS CNF compiler"
authors = [{name = "Aaron Windsor", email = "aaron.windsor@gmail.com"}]
license = "Unlicense"
readme = "README.md"
requires-python = ">=3.9"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
